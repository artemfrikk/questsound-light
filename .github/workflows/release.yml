# On a tag v*: test, then build every download and publish one release.
#   Desktop program (window + tray): Windows one-file .exe, macOS .app (Apple Silicon and Intel), Linux AppImage.
#   Console version (Raspberry Pi, servers): archives with Node.js inside, checked against nodejs.org's SHA256SUMS.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test "test/*.test.mjs"

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/QuestSound-Light.exe }

  macos:
    needs: test
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --mac --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/QuestSound-Light-mac-*.zip }

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/QuestSound-Light.AppImage }

  console:
    needs: test
    runs-on: ubuntu-latest
    env:
      NODE_LINE: latest-v22.x
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Node.js
        run: |
          set -e
          base=https://nodejs.org/dist/$NODE_LINE
          curl -fsSL $base/SHASUMS256.txt -o SHASUMS256.txt
          files=""
          for p in win-x64.zip linux-x64.tar.gz linux-arm64.tar.gz darwin-arm64.tar.gz darwin-x64.tar.gz; do
            f=$(grep -o "node-v[0-9.]*-$p" SHASUMS256.txt | head -1); curl -fsSLO $base/$f; files="$files $f"
          done
          for f in $files; do grep -E " $f$" SHASUMS256.txt; done | sha256sum -c -
      - name: Pack
        run: |
          set -e
          src="questsound-light.mjs package.json lib modules README.md README.ru.md SECURITY.md LICENSE"
          mkdir -p out
          mkdir -p w/questsound-light; cp -r $src w/questsound-light/
          win=$(ls node-v*-win-x64.zip); unzip -q $win -d w; mv w/${win%.zip} w/questsound-light/node
          printf '@echo off\r\ncd /d "%%~dp0"\r\nnode\node.exe questsound-light.mjs %%*\r\npause\r\n' > w/questsound-light/start.cmd
          (cd w && zip -qr ../out/questsound-light-console-win-x64.zip questsound-light)
          for p in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            d=b-$p/questsound-light; mkdir -p $d; cp -r $src $d/
            tar xzf node-v*-$p.tar.gz -C b-$p; mv b-$p/node-v*-$p $d/node
            case $p in
              linux-*) cp questsound-light.service $d/; cp start.sh $d/start.sh; chmod +x $d/start.sh ;;
              darwin-*) cp start.command $d/start.command; chmod +x $d/start.command ;;
            esac
            name=${p/darwin-arm64/macos-arm64}; name=${name/darwin-x64/macos-x64}
            tar czf out/questsound-light-console-$name.tar.gz -C b-$p questsound-light
          done
      - uses: actions/upload-artifact@v4
        with: { name: console, path: out/* }

  release:
    needs: [windows, macos, linux, console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
